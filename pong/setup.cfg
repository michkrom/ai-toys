[metadata]
name = ai-pong
version = 0.1.0
description = AI-powered Pong game with ML controller training capabilities
author = Your Name
author_email = your.email@example.com

[options]
packages = find:
python_requires = >=3.8
install_requires =
    pygame>=2.0.0
    blessed>=1.17.0
    numpy>=1.20.0

[options.packages.find]
where = .
exclude = tests*

[options.entry_points]
console_scripts =
    pong = pong:main